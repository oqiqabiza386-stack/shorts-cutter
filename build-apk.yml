# GitHub-এ রিপোতে এই ফাইলটি রাখুন: .github/workflows/build-apk.yml
# তারপর Actions ট্যাব → "Build APK" → Run workflow। শেষে Artifacts থেকে APK নামান।
# নোট: এটি Capacitor WebView APK। ফাইল সেভ/শেয়ারে সমস্যা হলে PWABuilder (TWA) বা Chrome PWA ব্যবহার করুন।
name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html app.js style.css manifest.json sw.js icon-192.png icon-512.png www/
      - name: Add Capacitor Android
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Shorts Cutter" com.example.shortscutter --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-cutter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
